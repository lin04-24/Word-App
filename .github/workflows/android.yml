name: Android verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Prepare SDK
        run: |
          chmod +x gradlew
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Prepare debug signing key for tests
        run: |
          android_user_home="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$android_user_home"
          if [ ! -f "$android_user_home/debug.keystore" ]; then
            keytool -genkeypair -keystore "$android_user_home/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Create signed test APKs
        shell: pwsh
        run: ./scripts/Prepare-UpdateFixtures.ps1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 35 device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: |
            ./gradlew connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.notClass=com.example.moci.UpdateInstallFlowTest' --no-daemon
            bash scripts/Test-UpgradeSmoke.sh
      - name: Collect device log
        if: always()
        run: |
          mkdir -p app/build/reports
          if adb devices | awk 'NR > 1 && $2 == "device" { found = 1 } END { exit !found }'; then
            timeout 20s adb logcat -d > app/build/reports/device-log.txt || true
          else
            touch app/build/reports/device-log.txt
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
            .test-tools/upgrade-*.log
